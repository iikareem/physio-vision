services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: physio
      POSTGRES_PASSWORD: physio
      POSTGRES_DB: physio
    volumes:
      - physio_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physio -d physio"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://physio:physio@db:5432/physio?sslmode=disable
      AUTH_EMAIL: ${AUTH_EMAIL:-khaled@physio.local}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      AUTH_NAME: ${AUTH_NAME:-Khaled}
      JWT_SECRET: ${JWT_SECRET}
      HTTP_ADDR: ":8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: /data/uploads
    volumes:
      - physio_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  physio_pg:
  physio_uploads:
